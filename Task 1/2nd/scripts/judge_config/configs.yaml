weighted_qwen3_8_max:
  prompt_template: judge_config/alpaca_eval_clf.txt
  fn_completions: openai_completions
  completions_kwargs:
    model_name: qwen3.8-max
    max_tokens: 1
    temperature: 1
    logprobs: true
    top_logprobs: 5
    client_config_path: client_configs.yaml
    extra_body:
      enable_thinking: false
  fn_completion_parser: logprob_parser
  completion_parser_kwargs:
    numerator_token: m
    denominator_tokens:
    - m
    - M
    is_binarize: false
  completion_key: completions_all
  batch_size: 1
